<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download CVE Data</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Custom Styling -->
    <style>
        body {
            background-color: #f5f5f5;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col s12 m8 offset-m2">
                <div class="card">
                    <div class="card-content">
                        <span class="card-title center-align">Download CVE Data</span>

                        <!-- Display Messages -->
                        {% if messages %}
                        <ul class="collection">
                            {% for message in messages %}
                                <li class="collection-item {% if message.tags %}{{ message.tags }}{% endif %}">
                                    {{ message }}
                                </li>
                            {% endfor %}
                        </ul>
                        {% endif %}

                        <!-- Form -->
                        <form method="post" action="{% url 'download_cve' %}">
                            {% csrf_token %}
                            <div class="input-field">
                                <input id="start_index" name="start_index" type="number" min="0" required>
                                <label for="start_index">Enter Start Index</label>
                            </div>
                            <div class="center-align">
                                <button type="submit" class="btn waves-effect waves-light">
                                    Download CVE Data
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script>
        // Initialize Materialize components
        document.addEventListener('DOMContentLoaded', function () {
            M.AutoInit();
        });
    </script>

</body>
</html>
