<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Custom Styling -->
    <style>
        body {
            background-color: #f5f5f5;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            padding: 20px;
            text-align: center;
        }

        .card-title {
            font-size: 1.8rem;
        }

        .btn-custom {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col s12 m8 offset-m2">
                <div class="card">
                    <span class="card-title">Admin Panel</span>
                    <div class="card-content">
                        <a href="{% url 'create_admin' %}" class="btn waves-effect waves-light orange btn-custom">Create Admin</a>
                        <a href="{% url 'download_cve' %}" class="btn waves-effect waves-light blue btn-custom">Download CVE Data</a>
                        <a href="{% url 'download_status' %}" class="btn waves-effect waves-light green btn-custom">Download Status</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
</html>
